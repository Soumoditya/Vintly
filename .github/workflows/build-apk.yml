name: Build Android APK

# Builds a downloadable Vintly APK on every push and on demand.
# The APK is uploaded as a workflow "Artifact" AND attached to a Release
# so you can install it directly from your phone — no computer needed.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash
        run: npx capacitor-assets generate --android || echo "asset generation skipped"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Vintly.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vintly-APK
          path: out/Vintly.apk
          if-no-files-found: error

      - name: Publish to "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vintly — latest build
          body: |
            📱 **Vintly latest build**

            Download `Vintly.apk` below and open it on your Android phone to install.
            (You may need to allow "Install unknown apps" for your browser/files app.)

            Built automatically from the latest code.
          files: out/Vintly.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
